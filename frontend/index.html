<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VaaniAI — Next-Gen Voice Cloning Studio">
    <title>🎙️ VaaniAI — Voice Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Background Ambient Glows -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
        
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎙️</span>
                <div class="logo-text">
                    <h1>Vaani Studio</h1>
                    <span class="logo-tagline">AI Voice Cloning Engine</span>
                </div>
            </div>
            <div class="header-status">
                <div class="status-indicator online"></div>
                <span id="serverStatusText">Server Connected</span>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Left Panel: Voice Management -->
            <section class="panel glass-panel voice-panel">
                <div class="panel-header">
                    <h2>Voice Library</h2>
                    <span class="badge" id="voiceCount">0 Voices</span>
                </div>
                
                <div class="voice-list-container">
                    <ul class="voice-list" id="voiceList">
                        <div class="loading-spinner small"></div>
                    </ul>
                </div>

                <div class="upload-section">
                    <h3>Create New Clone</h3>
                    <div class="upload-dropzone" id="dropzone">
                        <svg class="upload-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>Drop audio file or <span class="text-highlight">browse</span></p>
                        <span class="file-hint">Supports .mp3, .wav (Max 10s recommended)</span>
                        <input type="file" id="fileInput" accept="audio/*" hidden>
                    </div>
                    
                    <div class="divider"><span>OR</span></div>
                    
                    <button class="btn btn-secondary btn-full" id="btnRecord">
                        <span class="record-dot" id="recordDot"></span>
                        <span id="recordText">Record Live Audio</span>
                    </button>
                    
                    <div id="uploadProgress" class="progress-bar-container hidden">
                        <div class="progress-bar" id="progressBar"></div>
                        <span class="progress-text" id="progressText">Processing...</span>
                    </div>
                </div>
            </section>

            <!-- Right Panel: Synthesis -->
            <section class="panel glass-panel synth-panel">
                <div class="panel-header">
                    <h2>Synthesis Lab</h2>
                </div>
                
                <div class="synth-form">
                    <div class="form-group">
                        <label for="textInput">What should the voice say?</label>
                        <textarea id="textInput" placeholder="Type your script here... XTTS will synthesize it with perfect emotion and cadence." rows="6"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="voiceSelect">Select Voice</label>
                            <div class="custom-select">
                                <select id="voiceSelect">
                                    <option value="" disabled selected>Loading voices...</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group flex-1">
                            <label for="languageSelect">Language</label>
                            <div class="custom-select">
                                <select id="languageSelect">
                                    <option value="hi" selected>Hindi / Hinglish</option>
                                    <option value="en">English</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="emotionSelect">Emotion Preset</label>
                            <div class="custom-select">
                                <select id="emotionSelect">
                                    <option value="neutral" selected>Neutral</option>
                                    <option value="excited">Excited / High Energy</option>
                                    <option value="sad">Sad / Serious</option>
                                    <option value="angry">Angry / Aggressive</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-row advanced-controls" style="flex-wrap: wrap;">
                        <div class="form-group flex-1" style="min-width: 45%;">
                            <div class="label-row">
                                <label for="stabilitySlider">Stability</label>
                                <span class="slider-val" id="stabilityVal">50%</span>
                            </div>
                            <input type="range" id="stabilitySlider" min="0" max="100" step="1" value="50">
                            <span class="file-hint">More variable &nbsp; ↔ &nbsp; More stable</span>
                        </div>
                        <div class="form-group flex-1" style="min-width: 45%;">
                            <div class="label-row">
                                <label for="similaritySlider">Similarity Enhancement</label>
                                <span class="slider-val" id="similarityVal">50%</span>
                            </div>
                            <input type="range" id="similaritySlider" min="0" max="100" step="1" value="50">
                            <span class="file-hint">Low (blurry) &nbsp; ↔ &nbsp; High (exact)</span>
                        </div>
                        <div class="form-group flex-1" style="min-width: 45%; margin-top: 1rem;">
                            <div class="label-row">
                                <label for="speedSlider">Style / Speed</label>
                                <span class="slider-val" id="speedVal">1.0x</span>
                            </div>
                            <input type="range" id="speedSlider" min="0.7" max="1.5" step="0.05" value="1.0">
                        </div>
                    </div>

                    <button class="btn btn-primary btn-generate" id="btnGenerate">
                        <span class="btn-text" id="generateBtnText">Generate Speech</span>
                        <svg class="play-icon" id="generateBtnIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <div class="loading-spinner hidden" id="generateSpinner"></div>
                    </button>
                </div>

                <div class="audio-result-container hidden" id="resultContainer">
                    <div class="result-header">
                        <h3>Generated Audio</h3>
                        <span class="generation-time" id="genTime"></span>
                    </div>
                    <div class="custom-player">
                        <audio id="audioPlayer" controls></audio>
                        <a href="#" id="downloadBtn" class="btn-icon" download="vaani_synth.wav" title="Download Audio">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </a>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
